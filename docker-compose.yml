services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_local_password
      POSTGRES_DB: novawear
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d novawear"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nova_pgdata:
